name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a PR pushed to twice) to save
# minutes -- only the latest push's results matter.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: mypy (strict)
        run: mypy src

      - name: pytest (with coverage gate)
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit --skip-editable

  infrastructure:
    name: Validate SAM template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: cfn-lint
        run: cfn-lint template.yaml bootstrap/*.yaml

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: sam validate --lint
        run: sam validate --lint

      - name: sam build
        run: sam build --use-container

  ml:
    name: Train and smoke-test the model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with ml extras
        run: pip install -e ".[ml]"

      - name: Train and package the reference model
        run: python ml/train.py --output-dir ml/build

      - name: Smoke-test the inference contract
        run: |
          python - <<'PY'
          import sys
          import tarfile
          import tempfile

          sys.path.insert(0, "ml")
          import inference

          with tempfile.TemporaryDirectory() as tmpdir:
              with tarfile.open("ml/build/model.tar.gz") as tar:
                  tar.extractall(tmpdir, filter="data")
              model = inference.model_fn(tmpdir)
              rows = inference.input_fn("5.1,3.5,1.4,0.2\n6.7,3.1,4.7,1.5\n6.3,3.3,6.0,2.5", "text/csv")
              predictions = inference.predict_fn(rows, model)
              output, _ = inference.output_fn(predictions, "text/csv")
              assert output == "0\n1\n2", f"unexpected predictions: {output!r}"
          print("Inference contract OK")
          PY
