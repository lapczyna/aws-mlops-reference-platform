[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-inference-platform"
version = "0.1.0"
description = "Serverless batch inference platform reference architecture on AWS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Artur Lapczynski" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]

# Runtime dependencies for Lambda handlers and the shared application package.
# Business logic lands in Phase 3 -- these are declared now so the dev
# environment, linting and typing setup is stable from Phase 1 onward.
dependencies = [
    "boto3>=1.34,<2",
    "aws-lambda-powertools>=2.38,<3",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1",
    "black>=24.3,<25",
    "mypy>=1.9,<2",
    "boto3-stubs[essential,s3,dynamodb,stepfunctions,sagemaker,sagemaker-runtime]>=1.34,<2",
    "pytest>=8.1,<9",
    "pytest-cov>=5.0,<6",
    "pytest-mock>=3.14,<4",
    "moto[s3,dynamodb,stepfunctions,sagemaker]>=5.0,<6",
    "pre-commit>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff -- linting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "T20",  # flake8-print (no stray print/debug statements)
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101", # allow `assert` -- required in pytest test bodies
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["batch_inference_platform"]

# ---------------------------------------------------------------------------
# Black -- formatting
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# mypy -- static typing (strict mode)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, isolated unit tests with no external I/O",
    "integration: tests exercising mocked AWS services (moto)",
]

[tool.coverage.run]
source = ["src/batch_inference_platform"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
