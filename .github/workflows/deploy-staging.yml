name: Deploy to staging

# Triggered by the CI workflow completing on main, rather than push directly
# -- guarantees staging never receives a commit that hasn't passed lint,
# typecheck, tests, and template validation first.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write # required to assume the OIDC deploy role
  contents: read

jobs:
  deploy:
    name: sam deploy --config-env staging
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # See ADR-0016: named GitHub Environments scope environment-specific
    # variables (AWS_DEPLOY_ROLE_ARN) regardless of plan; protection rules
    # (required reviewers) additionally apply on public repos or GitHub
    # Team/Enterprise -- staging intentionally has none, matching the
    # auto-deploy-on-merge policy in docs/guides/deployment-strategy.md.
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      # See ci.yml's infrastructure job for why this is required: Lambda
      # functions build for arm64, this runner is x86_64, and without QEMU
      # emulation registered `sam build --use-container` hangs rather than
      # failing outright.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: sam build
        run: sam build --use-container

      - name: sam deploy
        run: sam deploy --config-env staging --no-confirm-changeset --no-fail-on-empty-changeset
